{{if .Values.resultHub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-hub
spec:
  replicas: {{.Values.resultHub.replicas | default 1}}
  selector:
    matchLabels:
      app: result-hub
  template:
    metadata:
      labels:
        app: result-hub
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - result-hub
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-mysql
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -ex
              until nc -zv {{ .Values.mysql.host }} {{ .Values.mysql.port }}; do sleep 5; done
              sleep 10
        - name: wait-kafka
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: metersphere-config
                  key: kafka.bootstrap-servers
          command:
            - sh
            - -c
            - |
              set -ex
              for i in ${KAFKA_BOOTSTRAP_SERVERS//,/ };do
                until nc -zv ${i%:*} ${i#*:};do sleep 5;done
                echo "Kafka bootstrap $i is OK now."
                sleep 5
              done
      containers:
        - name: result-hub
          image: {{.Values.common.imagePrefix}}{{.Values.common.image}}:{{.Values.common.imageTag}}
          imagePullPolicy: {{.Values.common.imagePullPolicy}}
          resources:
            {{- if .Values.resultHub.resources }}
            {{- toYaml .Values.resultHub.resources | nindent 12 }}
            {{- else if .Values.common.resources }}
            {{- toYaml .Values.common.resources | nindent 12 }}
            {{- else }}
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
            {{- end }}
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: FORMAT_MESSAGES_PATTERN_DISABLE_LOOKUPS
              value: "true"
            {{- if .Values.common.env }}
            {{- toYaml .Values.common.env | nindent 12 }}
            {{- end }}
            {{- if .Values.resultHub.env }}
            {{- toYaml .Values.resultHub.env | nindent 12 }}
            {{- end }}
          envFrom:
            {{- if .Values.common.envFrom }}
            {{- toYaml .Values.common.envFrom | nindent 12 }}
            {{- end }}
            {{- if .Values.resultHub.envFrom }}
            {{- toYaml .Values.resultHub.envFrom | nindent 12 }}
            {{- end }}
          command:
            - sh
            - -c
            - |
              sh /shells/result-hub.sh
          volumeMounts:
            - mountPath: /opt/metersphere/conf
              name: opt-metersphere-config
            - mountPath: /opt/metersphere/logs
              name: metersphere-logs
      {{if ne (.Values.common.imagePullSecrets | default "nil") "nil"}}
      imagePullSecrets:
        - name: {{.Values.common.imagePullSecrets}}
      {{ end }}
      volumes:
        - configMap:
            defaultMode: 420
            name: metersphere-config
            items:
            - key: metersphere.properties
              path: metersphere.properties
            - key: redisson.yml
              path: redisson.yml
          name: opt-metersphere-config
        - name: metersphere-logs
          {{if .Values.logPersistence.enabled}}
          persistentVolumeClaim:
            claimName: metersphere-logs-pvc
          {{ else }}
          emptyDir: {}
          {{ end }}

{{end}}
